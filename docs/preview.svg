<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fbf9f6"/>
  <rect x="0" y="0" width="1200" height="10" fill="#7a5c3d"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="22" letter-spacing="3" fill="#5d564d">MACOS · IOS · WINDOWS · ANDROID</text>

    <text x="80" y="232" font-size="112" font-weight="700" letter-spacing="-3" fill="#191713">Tratto</text>

    <text x="80" y="298" font-size="35" fill="#191713">A bowel diary you will actually keep</text>

    <text x="80" y="358" font-size="25" fill="#5d564d">Three taps for a bathroom visit. One question at night.</text>
    <text x="80" y="393" font-size="25" fill="#5d564d">Everything stays on your device.</text>

    <g>
      <rect x="80" y="444" width="330" height="96" rx="14" fill="#ffffff" stroke="#e2dad0" stroke-width="2"/>
      <text x="106" y="486" font-size="27" font-weight="700" fill="#2f6b43">Free</text>
      <text x="106" y="518" font-size="19" fill="#5d564d">no account, no subscription</text>

      <rect x="434" y="444" width="330" height="96" rx="14" fill="#ffffff" stroke="#e2dad0" stroke-width="2"/>
      <text x="460" y="486" font-size="27" font-weight="700" fill="#2f6b43">Local</text>
      <text x="460" y="518" font-size="19" fill="#5d564d">no server, no telemetry</text>

      <rect x="788" y="444" width="330" height="96" rx="14" fill="#ffffff" stroke="#e2dad0" stroke-width="2"/>
      <text x="814" y="486" font-size="27" font-weight="700" fill="#2f6b43">Exportable</text>
      <text x="814" y="518" font-size="19" fill="#5d564d">FHIR, CSV, JSON, PDF</text>
    </g>

    <text x="80" y="596" font-size="20" fill="#5d564d">nerln.github.io/tratto</text>
    <text x="1120" y="596" font-size="20" fill="#5d564d" text-anchor="end">Not a medical device</text>
  </g>
</svg>
